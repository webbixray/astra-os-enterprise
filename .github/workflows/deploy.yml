name: Deploy

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      ref:
        description: Git ref (tag or branch) to deploy
        required: true
        default: main
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event.inputs.environment || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  determine-env:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      deploy_staging: ${{ steps.check.outputs.deploy_staging }}
      deploy_production: ${{ steps.check.outputs.deploy_production }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.environment }}" = "production" ]; then
              echo "deploy_production=true" >> $GITHUB_OUTPUT
              echo "deploy_staging=false" >> $GITHUB_OUTPUT
            else
              echo "deploy_staging=true" >> $GITHUB_OUTPUT
              echo "deploy_production=false" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "deploy_staging=true" >> $GITHUB_OUTPUT
            echo "deploy_production=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_staging=true" >> $GITHUB_OUTPUT
            echo "deploy_production=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: determine-env
    if: needs.determine-env.outputs.deploy_staging == 'true' || needs.determine-env.outputs.deploy_production == 'true'
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,suffix=,format=short
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ github.sha }}
          format: spdx-json
          output: sbom.spdx.json
          exit-code: 0

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [determine-env, build]
    if: needs.determine-env.outputs.deploy_staging == 'true'
    environment:
      name: staging
      url: https://staging.astraos.io
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.STAGING_SSH_KEY }}
          known_hosts: ${{ secrets.STAGING_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Deploy via Docker Compose with zero-downtime
        run: |
          ssh ${{ secrets.STAGING_HOST }} "
            set -e
            cd /opt/astraos
            docker compose pull app web queue scheduler
            docker compose run --rm app php artisan migrate --force --no-interaction
            docker compose up -d --no-deps --scale app=2 app
            sleep 5
            docker compose up -d --no-deps --scale app=1 app
            docker compose up -d --no-deps web queue scheduler
            docker image prune -f
            curl -f --retry 3 --retry-delay 5 https://staging.astraos.io/api/v1/health || exit 1
            echo 'Staging deployment completed successfully'
          "

      - name: Run post-deployment smoke tests
        run: |
          curl -f --retry 3 --retry-delay 5 https://staging.astraos.io/api/v1/health || exit 1
          echo "Health check passed"

  smoke-tests-staging:
    name: Smoke Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: success()
    timeout-minutes: 10
    steps:
      - name: Run smoke tests against staging
        run: |
          echo "Running smoke tests against staging..."
          curl -f --retry 3 --retry-delay 5 https://staging.astraos.io/api/v1/health || exit 1
          curl -f --retry 2 --retry-delay 3 https://staging.astraos.io/api/v1/status || echo "Status endpoint not available"
          echo "Smoke tests passed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [determine-env, deploy-staging, build]
    if: needs.determine-env.outputs.deploy_production == 'true'
    environment:
      name: production
      url: https://astraos.io
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manual approval gate
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ vars.PRODUCTION_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Deploy to Production - ${{ github.ref_name }}"
          issue-body: |
            Please approve or deny the deployment of ${{ github.ref_name }} to production.
            - Commit: ${{ github.sha }}
            - Tag: ${{ github.ref_name }}
          exclude-workflow-initiator-as-approver: false

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          known_hosts: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Deploy via Docker Compose with zero-downtime
        run: |
          ssh ${{ secrets.PRODUCTION_HOST }} "
            set -e
            cd /opt/astraos
            docker compose exec -T db pg_dump -U astra astra_os > /tmp/pre-deploy-backup.sql
            docker compose pull app web queue scheduler
            docker compose run --rm app php artisan migrate --force --no-interaction
            docker compose up -d --no-deps --scale app=3 app
            sleep 8
            docker compose up -d --no-deps --scale app=2 app
            docker compose up -d --no-deps web queue scheduler
            docker compose exec app php artisan optimize:clear
            docker compose exec app php artisan optimize
            docker compose exec queue php artisan horizon:terminate
            docker image prune -f
            curl -f --retry 5 --retry-delay 10 https://astraos.io/api/v1/health || exit 1
            echo 'Production deployment completed successfully'
          "

      - name: Run post-deployment smoke tests
        run: |
          sleep 10
          curl -f --retry 5 --retry-delay 10 https://astraos.io/api/v1/health || exit 1
          curl -f --retry 3 --retry-delay 5 https://astraos.io/api/v1/status || echo "Status endpoint not available"
          echo "All production smoke tests passed"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: startsWith(github.ref, 'refs/tags/v') && success()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy-production.result }}" = "success" ] || [ "${{ needs.deploy-staging.result }}" = "success" ]; then
            echo "status=${{ needs.deploy-production.result == 'success' && 'success' || needs.deploy-staging.result }}" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack - Success
        if: steps.status.outputs.status == 'success'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployment Successful - ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Astra OS Deployment Successful*\n Tag: ${{ github.ref_name }}\n Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\n Environment: ${{ needs.deploy-production.result == 'success' && 'Production' || 'Staging' }}\n Author: ${{ github.triggering_actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack - Failure
        if: steps.status.outputs.status != 'success'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployment Failed - ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Astra OS Deployment Failed*\n Tag: ${{ github.ref_name }}\n Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\n Author: ${{ github.triggering_actor }}\n\nCheck the workflow run for details and rollback if needed."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
