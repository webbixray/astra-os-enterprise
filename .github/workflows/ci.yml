name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, curl, gd, redis, intl, bcmath, pdo_pgsql
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  phpstan:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, curl, gd, redis, intl, bcmath, pdo_pgsql
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, curl, gd, redis, intl, bcmath, pdo_pgsql
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPStan strict rules
        run: ./vendor/bin/phpstan analyse --level=max --memory-limit=2G --error-format=github || true

  test:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astraos_test
          POSTGRES_USER: astraos
          POSTGRES_PASSWORD: astraos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, xml, curl, gd, redis, intl, bcmath, pdo_pgsql
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Copy environment
        run: cp .env.example .env
      - name: Generate key
        run: php artisan key:generate
      - name: Run tests
        run: php artisan test --parallel --coverage-clover coverage.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astraos_test
          DB_USERNAME: astraos
          DB_PASSWORD: astraos
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Security check (composer)
        run: composer audit
      - name: Run security checker
        uses: symfonycorp/security-checker-action@v5
