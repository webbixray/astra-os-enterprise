name: Test Suite

on:
  push:
    branches:
      - main
      - develop
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: read
  checks: write
  issues: write

env:
  APP_ENV: testing
  DB_CONNECTION: pgsql
  DB_HOST: localhost
  DB_PORT: 5432
  DB_DATABASE: astra_os_test
  DB_USERNAME: astra_os
  DB_PASSWORD: secret
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  TELESCOPE_ENABLED: false
  PULSE_ENABLED: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]
        stability: [prefer-stable]
        include:
          - php: 8.4
            stability: prefer-lowest

    name: PHP ${{ matrix.php }} (${{ matrix.stability }})

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astra_os_test
          POSTGRES_USER: astra_os
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis, intl, gd, bcmath, xml, json
          tools: composer:v2
          coverage: pcov
          ini-values: pcov.directory=., pcov.exclude="~vendor~"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies (${{ matrix.stability }})
        env:
          COMPOSER_STABILITY: ${{ matrix.stability }}
        run: |
          if [ "${{ matrix.stability }}" = "prefer-lowest" ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
          fi

      - name: Copy environment file
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done

      - name: Run database migrations
        run: php artisan migrate --force --no-interaction
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret

      - name: Run tests with parallel execution
        run: php artisan test --parallel --coverage-clover coverage.xml --coverage-cobertura coverage.cobertura.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run Prometheus metrics test
        run: |
          php artisan test --filter=PrometheusMetricsTest --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run OpenTelemetry test
        run: |
          php artisan test --filter=OpenTelemetryTest --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run backup command test
        run: |
          php artisan test --filter=BackupCommandTest --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success() || failure()
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        if: success() || failure()
        with:
          file: coverage.cobertura.xml
          format: cobertura
          fail-on-error: false
        continue-on-error: true

      - name: Upload test results to GitHub
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: PHP ${{ matrix.php }} Test Results
          path: 'coverage.cobertura.xml'
          reporter: java-junit
          fail-on-error: false

  dusk-tests:
    name: Dusk (Browser) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astra_os_test
          POSTGRES_USER: astra_os
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, intl, pdo_pgsql, redis, xml, json, bcmath, gd, zip, pcov
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Chrome
        run: |
          sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Copy .env
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force --no-interaction
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret

      - name: Start Laravel server
        run: php artisan serve --env=testing --port=8080 &
        env:
          APP_URL: http://localhost:8080
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run Dusk tests
        run: php artisan dusk --coverage-clover dusk-coverage.xml
        env:
          APP_URL: http://localhost:8080
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: astra_os_test
          DB_USERNAME: astra_os
          DB_PASSWORD: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  notification:
    name: Notification
    runs-on: ubuntu-latest
    needs: [tests, dusk-tests]
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Notify on test failure
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ *Scheduled Test Suite Failed* — ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Scheduled Test Suite Failed*\n• Repository: ${{ github.repository }}\n• Branch: ${{ github.ref_name }}\n• Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\n• Date: ${{ github.event.schedule || 'manual' }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
