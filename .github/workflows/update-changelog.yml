name: Update Changelog

on:
  release:
    types: [released, prereleased]

permissions:
  contents: write

jobs:
  update:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate changelog entry
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            const tag = release.tag_name;
            const releaseName = release.name || tag;
            const body = release.body || '';
            const date = new Date(release.published_at).toISOString().split('T')[0];
            const repoUrl = context.payload.repository.html_url;

            let changelogEntry = `## [${releaseName}](${repoUrl}/releases/tag/${tag}) - ${date}\n\n`;

            if (body) {
              // Clean up the body and add as changelog content
              changelogEntry += body.replace(/### /g, '### ');
            } else {
              changelogEntry += 'No release notes provided.\n';
            }

            changelogEntry += '\n';

            return changelogEntry;

      - name: Update CHANGELOG.md
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelogEntry = '${{ steps.changelog.outputs.result }}';

            let currentContent = '';
            try {
              currentContent = fs.readFileSync('CHANGELOG.md', 'utf8');
            } catch {
              // File doesn't exist yet
            }

            // Build the new content with the new entry at the top
            const header = '# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n';
            const newContent = header + changelogEntry +
              (currentContent.startsWith('# Changelog') ?
                currentContent.replace(/^# Changelog\n\n/, '') :
                currentContent);

            fs.writeFileSync('CHANGELOG.md', newContent);

      - name: Commit and push changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: update CHANGELOG.md for ${{ github.event.release.tag_name }}'
          file_pattern: CHANGELOG.md
          branch: main
          skip_fetch: true
