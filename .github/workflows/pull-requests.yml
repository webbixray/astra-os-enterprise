name: Pull Requests

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: write
  contents: read
  issues: write
  checks: write

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const issues = [];

            // Check for required sections
            if (!body.includes('## Type')) {
              issues.push('- Missing **Type** section (e.g., Feature, Bugfix, Refactor)');
            }
            if (!body.includes('## Description')) {
              issues.push('- Missing **Description** section');
            }
            if (!body.includes('## Changes')) {
              issues.push('- Missing **Changes** section');
            }
            if (!body.includes('## Testing')) {
              issues.push('- Missing **Testing** section');
            }

            if (issues.length > 0) {
              const message = '### PR Description Checklist\n\nThe following required sections are missing from the PR description:\n\n' +
                issues.join('\n') + '\n\nPlease update the PR description to include these sections.';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message
              });
            }

      - name: Size labeling
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-assign author
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login]
            });

      - name: Add size labels based on changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;

            // Remove existing size labels
            const sizeLabels = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl'];
            const existingLabels = pr.labels.map(l => l.name);
            const toRemove = existingLabels.filter(l => sizeLabels.includes(l));

            for (const label of toRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: label
              }).catch(() => {});
            }

            // Determine and add appropriate size label
            let sizeLabel = 'size/m';
            if (total < 10) sizeLabel = 'size/xs';
            else if (total < 50) sizeLabel = 'size/s';
            else if (total < 200) sizeLabel = 'size/m';
            else if (total < 500) sizeLabel = 'size/l';
            else sizeLabel = 'size/xl';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel]
            });

  auto-cc:
    name: Auto-CC Code Owners
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    steps:
      - name: Request review from code owners
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;

            // Try to get CODEOWNERS file
            try {
              const codeowners = await github.rest.repos.getContent({
                owner: repo.owner,
                repo: repo.repo,
                path: '.github/CODEOWNERS'
              });
              // Code owners file exists, GitHub auto-requests reviews
              console.log('CODEOWNERS file exists, GitHub will auto-request reviews');
            } catch {
              console.log('No CODEOWNERS file found, skipping auto-review request');
            }
