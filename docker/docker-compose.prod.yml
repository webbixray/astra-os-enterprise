services:
  # Production Application Server
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Production
  web:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Production
  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    volumes:
      - astra_db_prod:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-astra_os}
      POSTGRES_USER: ${DB_USERNAME:-astra}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Production
  redis:
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Queue Worker Production
  queue:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: php artisan horizon

  # Scheduler Production
  scheduler:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    command: php artisan schedule:work

  # Mailpit (optional - remove in production if using real mail)
  mailpit:
    profiles:
      - mail
    restart: always

volumes:
  astra_db_prod:
  astra_redis_prod:
