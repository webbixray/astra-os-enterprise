; =============================================================================
; Astra OS — Supervisor Production Configuration
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; =============================================================================
; PHP-FPM
; =============================================================================
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Nginx
; =============================================================================
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Laravel Horizon Workers (3 supervisors for queue throughput)
; =============================================================================

; Horizon worker pool 1 — high priority queues (notifications, realtime)
[program:horizon-high]
command=php /var/www/html/artisan horizon:work --queue=high,default --sleep=3 --tries=3 --timeout=120 --delay=5
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/log/horizon-high-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/horizon-high-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=APP_ENV="production",QUEUE_CONNECTION="redis"

; Horizon worker pool 2 — default queues
[program:horizon-default]
command=php /var/www/html/artisan horizon:work --queue=default,emails --sleep=3 --tries=3 --timeout=120 --delay=5
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/log/horizon-default-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/horizon-default-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=APP_ENV="production",QUEUE_CONNECTION="redis"

; Horizon worker pool 3 — long-running / batch jobs
[program:horizon-longrunning]
command=php /var/www/html/artisan horizon:work --queue=longrunning,batch,reports --sleep=5 --tries=1 --timeout=600 --delay=10
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/log/horizon-longrunning-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/horizon-longrunning-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=APP_ENV="production",QUEUE_CONNECTION="redis"

; =============================================================================
; Laravel Scheduler (cron runner)
; =============================================================================
[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:work
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
user=www-data
stdout_logfile=/var/log/scheduler-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/scheduler-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=APP_ENV="production"

; =============================================================================
; Health check endpoint (simple HTTP health probe)
; =============================================================================
[program:health-check]
command=python3 -m http.server 8080 --directory /var/www/html/public 2>/dev/null || sh -c 'while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nok" | nc -l -p 8080 -q 1; done'
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Optional: Laravel Reverb WebSocket server
; =============================================================================
[program:reverb]
command=php /var/www/html/artisan reverb:start
process_name=%(program_name)s
numprocs=1
autostart=false
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
user=www-data
stdout_logfile=/var/log/reverb-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/reverb-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=APP_ENV="production"

[group:horizon]
programs=horizon-high,horizon-default,horizon-longrunning
priority=100

[group:astra-services]
programs=php-fpm,nginx,laravel-scheduler,health-check
priority=200
