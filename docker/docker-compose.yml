services:
  # PHP-FPM Application Server
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      target: development
    image: astra-os/app:latest
    container_name: astra-os-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ..:/app
      - ./php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./php/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
    networks:
      - astra-os
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-astra_os}
      DB_USERNAME: ${DB_USERNAME:-astra}
      DB_PASSWORD: ${DB_PASSWORD:-astra_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-debug}

  # Nginx Web Server
  web:
    image: nginx:1.26-alpine
    container_name: astra-os-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ..:/app:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - astra-os
    depends_on:
      - app

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: astra-os-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - astra_db_data:/var/lib/postgresql/data
    networks:
      - astra-os
    environment:
      POSTGRES_DB: ${DB_DATABASE:-astra_os}
      POSTGRES_USER: ${DB_USERNAME:-astra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-astra_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: astra-os-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - astra_redis_data:/data
    networks:
      - astra-os
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Queue Worker
  queue:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      target: development
    image: astra-os/app:latest
    container_name: astra-os-queue
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ..:/app
    networks:
      - astra-os
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-astra_os}
      DB_USERNAME: ${DB_USERNAME:-astra}
      DB_PASSWORD: ${DB_PASSWORD:-astra_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    command: php artisan horizon
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Scheduler
  scheduler:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      target: development
    image: astra-os/app:latest
    container_name: astra-os-scheduler
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ..:/app
    networks:
      - astra-os
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-astra_os}
      DB_USERNAME: ${DB_USERNAME:-astra}
      DB_PASSWORD: ${DB_PASSWORD:-astra_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan schedule:work

  # Mailpit (Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: astra-os-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - astra-os

  # Reverb (WebSockets)
  reverb:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      target: development
    image: astra-os/app:latest
    container_name: astra-os-reverb
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - "${REVERB_PORT:-8080}:8080"
    networks:
      - astra-os
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-astra_os}
      DB_USERNAME: ${DB_USERNAME:-astra}
      DB_PASSWORD: ${DB_PASSWORD:-astra_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    command: php artisan reverb:start --debug

networks:
  astra-os:
    driver: bridge

volumes:
  astra_db_data:
    driver: local
  astra_redis_data:
    driver: local
