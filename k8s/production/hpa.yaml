# =============================================================================
# Astra OS — Kubernetes HorizontalPodAutoscaler
# Production HPA for the application workload.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: astra-os-app
  namespace: astra-os
  labels:
    app: astra-os
    tier: backend
    managed-by: terraform
  annotations:
    description: "Astra OS production application auto-scaling"
    maintainer: "DevOps <devops@astra-os.example.com>"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: astra-os-app
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # --- CPU-based autoscaling ---
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # --- Memory-based autoscaling ---
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # --- Scale-down (conservative) ---
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Max
    # --- Scale-up (aggressive) ---
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
---
# =============================================================================
# Astra OS — HPA for Horizon Queue Workers
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: astra-os-horizon
  namespace: astra-os
  labels:
    app: astra-os
    component: horizon
    managed-by: terraform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: astra-os-horizon
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
---
# =============================================================================
# Astra OS — PodDisruptionBudget (ensures minimum availability during
# voluntary disruptions like node drains or rolling updates)
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: astra-os-app-pdb
  namespace: astra-os
  labels:
    app: astra-os
    tier: backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: astra-os
      tier: backend
