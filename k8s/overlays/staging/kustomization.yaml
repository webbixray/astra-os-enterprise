apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: astraos

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: astraos-app
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: astraos-app-hpa
  - patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: ["staging.api.astraos.io"]
      - op: replace
        path: /spec/rules/0/host
        value: "staging.api.astraos.io"
    target:
      kind: Ingress
      name: astraos-ingress

images:
  - name: ghcr.io/astraos/app
    newTag: staging

configMapGenerator:
  - name: astraos-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - APP_DEBUG=true
      - LOG_LEVEL=debug
