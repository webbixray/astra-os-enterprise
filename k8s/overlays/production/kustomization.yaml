apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: astraos

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: astraos-app
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
    target:
      kind: HorizontalPodAutoscaler
      name: astraos-app-hpa
  - patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: ["api.astraos.io"]
      - op: replace
        path: /spec/rules/0/host
        value: "api.astraos.io"
    target:
      kind: Ingress
      name: astraos-ingress

images:
  - name: ghcr.io/astraos/app
    newTag: production

configMapGenerator:
  - name: astraos-config
    behavior: merge
    literals:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=warning

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: astraos-app
    spec:
      template:
        spec:
          containers:
            - name: php-fpm
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 2Gi
            - name: nginx
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 512Mi
