apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: astraos
  labels:
    app: pgbouncer
    component: database-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        component: database-proxy
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.21.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6432
              name: pgbouncer
          env:
            - name: POSTGRES_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: astraos-db-credentials
                  key: pgbouncer-password-hash
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - pgbouncer
                - -c
                - /etc/pgbouncer/pgbouncer.ini
                - -R
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -p
                - "6432"
                - -U
                - pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
            items:
              - key: pgbouncer.ini
                path: pgbouncer.ini
              - key: userlist.txt
                path: userlist.txt