apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: astraos-api-keys
  namespace: astraos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: astraos-api-keys
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: astraos/prod/api-keys
        property: openai_api_key
    - secretKey: anthropic-api-key
      remoteRef:
        key: astraos/prod/api-keys
        property: anthropic_api_key
    - secretKey: meta-app-secret
      remoteRef:
        key: astraos/prod/api-keys
        property: meta_app_secret
    - secretKey: google-ads-developer-token
      remoteRef:
        key: astraos/prod/api-keys
        property: google_ads_developer_token
    - secretKey: sentry-dsn
      remoteRef:
        key: astraos/prod/monitoring
        property: sentry_dsn
    - secretKey: slack-webhook-url
      remoteRef:
        key: astraos/prod/notifications
        property: slack_webhook_url