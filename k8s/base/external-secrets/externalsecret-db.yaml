apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: astraos-db-credentials
  namespace: astraos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: astraos-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: pgbouncer-password-hash
      remoteRef:
        key: astraos/prod/database
        property: pgbouncer_password_hash
    - secretKey: database-password
      remoteRef:
        key: astraos/prod/database
        property: password