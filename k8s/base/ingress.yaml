apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astraos-ingress
  namespace: astraos
  labels:
    app: astraos
    component: ingress
    app.kubernetes.io/name: astraos-ingress
    app.kubernetes.io/part-of: astra-os
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.astraos.io
      secretName: astraos-tls
  rules:
    - host: api.astraos.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: astraos-app
                port:
                  number: 80
