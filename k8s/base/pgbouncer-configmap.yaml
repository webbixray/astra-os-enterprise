apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: astraos
data:
  pgbouncer.ini: |
    [databases]
    astraos = host=postgresql port=5432 dbname=astraos auth_user=pgbouncer

    [pgbouncer]
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 25
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    max_db_connections = 100
    max_user_connections = 100

    # Authentication
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = pgbouncer

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    stats_period = 60

    # Timeouts
    server_connect_timeout = 15
    server_login_retry = 15
    query_timeout = 0
    query_wait_timeout = 120
    client_idle_timeout = 0
    idle_transaction_timeout = 300

    # TLS
    client_tls_sslmode = disable
    server_tls_sslmode = disable

    # Health checks
    listen_addr = *
    listen_port = 6432
    unix_socket_dir = /tmp

    # Performance
    tcp_keepalive = 1
    tcp_keepcnt = 5
    tcp_keepidle = 30
    tcp_keepintvl = 10

  userlist.txt: |
    "pgbouncer" "md5{{POSTGRES_PASSWORD_HASH}}"
    "astraos" "md5{{POSTGRES_PASSWORD_HASH}}"