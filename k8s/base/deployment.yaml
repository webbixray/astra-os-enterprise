apiVersion: apps/v1
kind: Deployment
metadata:
  name: astraos-app
  namespace: astraos
  labels:
    app: astraos
    component: app
    app.kubernetes.io/name: astraos-app
    app.kubernetes.io/part-of: astra-os
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: astraos
      component: app
  template:
    metadata:
      labels:
        app: astraos
        component: app
        app.kubernetes.io/name: astraos-app
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: php-fpm
          image: ghcr.io/astraos/app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: fpm
          envFrom:
            - configMapRef:
                name: astraos-config
            - secretRef:
                name: astraos-secrets
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck.sh
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck.sh
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage

        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: app
              mountPath: /var/www/html
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: app
          emptyDir: {}
        - name: storage
          persistentVolumeClaim:
            claimName: astraos-storage
        - name: nginx-config
          configMap:
            name: astraos-nginx
