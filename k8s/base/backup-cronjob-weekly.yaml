apiVersion: batch/v1
kind: CronJob
metadata:
  name: astra-os-backup-weekly
  namespace: astraos
  labels:
    app: astra-os
    component: backup
    schedule: weekly
spec:
  schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: astra-os-backup
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: astra-os-api:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
                - |
                  php artisan backup:run --only-db --destination=s3
                  php artisan backup:run --only-files --destination=s3
                  php artisan backup:clean
              env:
                - name: APP_ENV
                  value: production
                - name: BACKUP_DISK
                  value: s3
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: astra-os-backup-secrets
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: astra-os-backup-secrets
                      key: aws-secret-access-key
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: astra-os-config
                      key: backup-bucket
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"