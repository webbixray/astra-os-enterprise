apiVersion: apps/v1
kind: Deployment
metadata:
  name: astraos-redis
  namespace: astraos
  labels:
    app: astraos
    component: redis
    app.kubernetes.io/name: astraos-redis
    app.kubernetes.io/part-of: astra-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astraos
      component: redis
  template:
    metadata:
      labels:
        app: astraos
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: astraos-redis-data